name: EMPIRE_DISTILL_V7
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  distill:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Manual Artery Checkout (Stealth Bypass)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" .
          
      - name: Pulse Artery (Log Activity)
        run: |
          echo "[*] Node Active: $(date)" >> pulse.log
          git config --global user.name "IGRIS-ARMADA"
          git config --global user.email "swarm@empire.void"
          git add pulse.log
          git commit -m "Pulse: Node Active $(date)"
          git pull origin main --rebase
          git push origin main

      - name: Master Distill & Secure (Visually Lossless)
        env:
          DO_ACCESS_KEY: DO00KZYF73XCB98PKALL
          DO_SECRET_KEY: lOpuOpgkzTWO51fKiD4uo3DCqgoH5UGWy9wt76EiOfI
          DO_BUCKET: vasanthandco
          DO_ENDPOINT: https://blr1.digitaloceanspaces.com
          DO_REGION: blr1
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl python3-pip unzip
          
          pip3 install awscli --break-system-packages --quiet || true
          if ! command -v aws &> /dev/null;
            then
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update --quiet
          fi
          
          if [ ! -s tasks.json ] || [ "$(cat tasks.json)" == "[]" ]; then
            echo "[*] Artery Empty."
            exit 0
          fi
          
          TASK=$(jq -c '. | select(type=="array") | .[0]' tasks.json)
          if [ -z "$TASK" ] || [ "$TASK" == "null" ]; then exit 0; fi
          
          ID=$(echo $TASK | jq -r .id)
          TITLE=$(echo $TASK | jq -r .title)
          URL_B64=$(echo $TASK | jq -r .url)
          URL=$(echo $URL_B64 | sed 's/b64://' | base64 -d)
          
          echo "[*] TARGET: $TITLE (ID: $ID)"
          
          # Pulse Artery with specific task
          echo "[*] Distilling: $TITLE" >> pulse.log
          git add pulse.log
          git commit -m "Production Start: $ID"
          git pull origin main --rebase
          git push origin main
          
          # High Quality RAM-Distill
          ffmpeg -i "$URL" \
            -c:v libx265 -pix_fmt yuv420p10le -crf 18 -preset ultrafast \
            -map_metadata -1 -metadata title="[Empire Release] $TITLE" \
            -c:a aac -b:a 256k \
            "empire_$ID.mp4"
          
          export AWS_ACCESS_KEY_ID=$DO_ACCESS_KEY
          export AWS_SECRET_ACCESS_KEY=$DO_SECRET_KEY
          
          aws s3 cp "empire_$ID.mp4" "s3://$DO_BUCKET/test-uploads/.sys_cache/empire_$ID.mp4" \
            --endpoint-url $DO_ENDPOINT --acl public-read
          
          if [ $? -eq 0 ]; then
            DOWNLOAD_URL="https://$DO_BUCKET.$DO_REGION.digitaloceanspaces.com/test-uploads/.sys_cache/empire_$ID.mp4"
            echo "[+] NATIVE PAYLOAD SECURED: $DOWNLOAD_URL"
            
            jq ". += [{\"id\": $ID, \"url\": \"$DOWNLOAD_URL\"}]" completions.json > completions.tmp && mv completions.tmp completions.json
            jq "del(.[0])" tasks.json > tasks.tmp && mv tasks.tmp tasks.json
            
            git add tasks.json completions.json
            git commit -m "Produced (High-Q): $ID"
            git pull origin main --rebase
            git push origin main
          else
            echo "[-] VAULTING FAILED"
            exit 1
          fi
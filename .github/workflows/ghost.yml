name: EMPIRE_DISTILL_V2
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  distill:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Master Distill & Secure
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg jq curl
          
          # Pull the next task that isn't PENDING
          TASK=$(jq -r '.[] | select(.url != "PENDING_RESOLVE")' tasks.json | head -n 1)
          if [ -z "$TASK" ] || [ "$TASK" == "null" ]; then echo "EMPTY_OR_PENDING"; exit 0; fi
          
          ID=$(echo $TASK | jq -r .id)
          TITLE=$(echo $TASK | jq -r .title)
          URL_B64=$(echo $TASK | jq -r .url)
          URL=$(echo $URL_B64 | sed 's/b64://' | base64 -d)
          
          echo "[*] TARGET: $TITLE (ID: $ID)"
          
          # Direct Stream Distill
          ffmpeg -i "$URL" \
            -c:v libx265 -pix_fmt yuv420p10le -crf 22 -preset ultrafast \
            -map_metadata -1 -metadata title="[Empire Release] $TITLE" \
            -c:a aac -b:a 192k \
            "empire_$ID.mp4"
          
          # UPLOAD TO GOFILE
          echo "[*] SECURING PAYLOAD TO GOFILE..."
          SERVER=$(curl -s https://api.gofile.io/getServer | jq -r .data.server)
          UPLOAD_RESP=$(curl -F "file=@empire_$ID.mp4" "https://$SERVER.gofile.io/uploadFile")
          DOWNLOAD_URL=$(echo $UPLOAD_RESP | jq -r .data.downloadPage)
          
          if [ "$DOWNLOAD_URL" != "null" ]; then
            echo "[+] PAYLOAD SECURED: $DOWNLOAD_URL"
            # Update Artery
            jq ". += [{"id": "$ID", "url": "$DOWNLOAD_URL"}]" completions.json > completions.tmp && mv completions.tmp completions.json
            
            git config --global user.name "IGRIS-ARMADA"
            git config --global user.email "swarm@empire.void"
            git add completions.json
            git commit -m "Produced: $ID"
            git pull origin main --rebase
            git push origin main
          else
            echo "[-] UPLOAD FAILED"
            exit 1
          fi
name: EMPIRE_DISTILL_V1
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  distill:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Manual Artery Protocol
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/shecodz/vortex.git
          git fetch --depth 1 origin main
          git checkout main
          
          sudo apt-get update && sudo apt-get install -y ffmpeg curl jq
          
          TASK=$(jq -r ".[ 0 ]" tasks.json)
          if [ "$TASK" == "null" ] || [ "$TASK" == "" ]; then exit 0; fi
          
          ID=$(echo $TASK | jq -r .id)
          TITLE=$(echo $TASK | jq -r .title)
          URL_B64=$(echo $TASK | jq -r .url)
          URL=$(echo $URL_B64 | sed 's/b64://' | base64 -d)
          
          echo "[*] TARGET: $TITLE"
          
          # Use curl for sequential streaming (No Seek)
          mkfifo master_pipe
          curl -L -s "$URL" > master_pipe &
          
          ffmpeg -i master_pipe \
            -c:v libx265 -pix_fmt yuv420p10le -crf 22 -preset ultrafast \
            -map_metadata -1 -metadata title="[Empire Release] $TITLE" \
            -c:a aac -b:a 192k \
            "empire_$ID.mp4"
          
          # Commissioning
          jq ". += [{\"id\": \"$ID\", \"url\": \"https://empire.storage/distill/$ID\"}]" completions.json > completions.tmp && mv completions.tmp completions.json
          
          git config --global user.name "IGRIS-ARMADA"
          git config --global user.email "swarm@empire.void"
          git add completions.json
          git commit -m "Produced: $ID" || exit 0
          git pull origin main --rebase
          git push origin main
